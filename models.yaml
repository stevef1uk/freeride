  - "ollama/gpt-oss:120b"
  - "ollama/mistral-large-3:675b"
  - "ollama/qwen3.5:397b"
  # Groq namespaced variants (exact-match exclusions are per-prefix)
  - "groq/allam-2-7b"
  - "groq/whisper-large-v3"                # audio model
  - "groq/whisper-large-v3-turbo"          # audio model
  - "nvidia/llama-3.1-nemotron-ultra-253b-v1"  # NVIDIA NIM 404; not routed on OpenRouter
  - "meta-llama/llama-3.2-1b-instruct:free" # TOO SMALL - Hallucinates
  - "meta-llama/llama-3.2-3b-instruct:free" # TOO SMALL - Hallucinates
  - "meta/llama-3.2-1b-instruct"          # TOO SMALL
  - "meta/llama-3.2-3b-instruct"          # TOO SMALL
  - "meta/llama-3.2-1b-instruct"          # NVIDIA VERSION - TOO SMALL
  - "meta/llama-3.2-3b-instruct"            # NVIDIA VERSION - TOO SMALL
  - "nvidia/llama-3.1-nemotron-nano-8b-v1"  # TOO SMALL
  - "nvidia/llama-3.1-nemotron-nano-vl-8b-v1" # TOO SMALL
  - "nvidia/nemotron-nano-12b-v2-vl"         # TOO SMALL
  - "nvidia/nemotron-mini-4b-instruct"      # TOO SMALL
  - "nvidia/nemotron-3-nano-30b-a3b"         # REASONING MODEL — produces reasoning_content, no content
  - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning" # REASONING MODEL
  - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free" # REASONING MODEL
  - "nvidia/nemotron-3-ultra-550b-a55b:free"  # ANALYSIS-ONLY — cannot execute CMD/WRITE/EDIT markers
  - "nvidia/nemotron-3-ultra-550b-a55b"       # ANALYSIS-ONLY
  - "nvidia/nemotron-3-super-120b-a12b"       # ANALYSIS-ONLY
  - "nvidia/nemotron-3-super-120b-a12b:free"   # ANALYSIS-ONLY (OpenRouter)
