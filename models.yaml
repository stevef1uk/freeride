  - "qwen/qwen3-coder"                          # 0% success — fails in practice
  - "groq/groq/compound"                        # 0% success
  - "groq/groq/compound-mini"                   # 0% success
  - "groq/openai/gpt-oss-120b"                  # 0% success
  - "groq/openai/gpt-oss-20b"                   # 0% success
  - "groq/openai/gpt-oss-safeguard-20b"         # 0% success
  - "groq/canopylabs/orpheus-v1-english"        # 0% success — requires terms acceptance
  - "groq/canopylabs/orpheus-arabic-saudi"      # 0% success — requires terms acceptance
  - "groq/meta-llama/llama-prompt-guard-2-22m"  # 0% success — safety model, not chat
  - "groq/meta-llama/llama-prompt-guard-2-86m"  # 0% success — safety model, not chat
  # Old groq exclusions removed — qwen3.6-27b deprecated, replaced by qwen3.8-27b
  - "mistralai/mistral-nemotron"                # 0% success

# When local GPU is enabled (--allow-local-openai + localOpenAI below): skip weak cloud models;
# capable cloud is tried first; local llama-server is fallback only (end of candidate list).
blockSmallCloudWhenLocalGPU:
  models:
    - "meta/llama-3.2-11b-vision-instruct"
    - "mistralai/mistral-nemo"
  patterns:
    - "nano"
    - "mini"
    - "-8b"
    - "-11b"
    - "-12b"
    - "-1b"
    - "-3b"
    - "-4b"
    - "llama3.1-8b"

# Priority 3: Local IDE Models (Opt-in via --allow-ide)
ideModels:
  - id: "google-antigravity/gemini-3-flash"
    cooldown: "2h30m"
    endpoint: "http://localhost:50000"
  - id: "google-antigravity/claude-3-5-sonnet"
    cooldown: "72h"
    endpoint: "http://localhost:50000"
  - id: "opencode/openai/gpt-4o"
    cooldown: "24h"
    endpoint: "http://localhost:40000"

# Local llama-server. Requires: ./freeride --allow-local-openai
#
# Two names (not interchangeable):
#   id    — LLM_MODEL in ~/gt/settings/config.json (Freeride route name)
#   model — JSON "model" sent to llama-server (from: curl -s :8090/v1/models | jq -r '.data[0].id')
#
# roleLocalExclude: roles that must NEVER use the local model. QA must use a
# different model than Polecat so it can catch Polecat's mistakes.
roleLocalExclude:
  - qa
  - architect
  - planner

localOpenAI:
  # llama.cpp server (:8090) — CURRENT resident engine (stable across hours of
  # agent turns; FreeToken hybrid-offload wedges under sustained load, entry
  # kept below for retesting after upstream fixes).
  - id: "local/qwen3-coder-30b"
    endpoint: "http://127.0.0.1:8090"
    model: "byteshape/Qwen3-Coder-30B-A3B-Instruct-GGUF"
    contextSlots: 32768  # must match llama-server -c; used to cap max_tokens in Freeride
    cooldown: "2m"
    promptSuffix: "/no_think"  # appended to last user msg; disables reasoning on this model
  # FreeToken engine (ft serve on :1919) — Qwen3.6-35B-A3B NVFP4, hybrid MoE
  # offload tuned for 12GB VRAM. Benchmark: 5/5 gastown format tests on a fresh
  # boot, BUT endurance soak (llm_bench --soak) showed it wedges after a handful
  # of turns on this box — do not enable until upstream stabilizes.
  # - id: "local/qwen3.6-35b-nvfp4"
  #   endpoint: "http://127.0.0.1:1919"
  #   model: "Qwen3.6-35B-A3B-NVFP4"
  #   contextSlots: 16384
  #   priority: true
  #   extraBody:
  #     chat_template_kwargs:
  #       enable_thinking: false

# Notes:
# - With OpenRouter credits, paid models work reliably (gpt-4o-mini, gemini-2.0-flash-001)
# - NVIDIA models are always free and don't require credits
# - Run with --allow-paid for paid fallbacks; --allow-local-openai for local fallback + weak-cloud block
