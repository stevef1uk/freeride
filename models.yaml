# Roles that must use "massive" models (70b+ heuristics in Go) — not model IDs.
# Architect/Planner/QA need big models; mayor/polecat only need capable.
massiveOnlyRoles:
  - architect
  - planner
  - qa

# Extra substring patterns that classify a model as "massive" — fully config-driven,
# no hardcoded list in Go. Lets massiveOnlyRoles routes use curated flagships
# like openai/gpt-5.6-luna without code changes.
massiveModelPatterns:
  - "671b"
  - "550b"
  - "397b"
  - "235b"
  - "1t"
  - "120b"
  - "large"
  - "480b"
  - "405b"
  - "90b"
  - "80b"
  - "70b"
  - "30b"
  - "sonnet"
  - "gpt-4"
  - "gpt-5.6"
  - "gemini"
  - "opus"
  - "deepseek-v4"
  - "nemotron-3.5-lightning"
  - "nemotron-3-ultra"
  - "inkling"
  - "north-mini-code"

# Extra candidates prepended for a role when --allow-paid (e.g. polecat coding)
# Roles in rolePrependBeforeOriginal try these BEFORE their originalModel; other
# roles (e.g. polecat) keep their originalModel first and use prepends as fallback.
rolePrependBeforeOriginal:
  - architect
  - planner
  - qa
  - polecat
  - tester
  - setup

rolePrepend:
  # Paid-first when --allow-paid (Option B): try flagship paid before free fallback,
  # so planner/architect/qa use better models instead of looping on minimax:free.
  polecat:
    - "openai/gpt-5.6-luna"
    - "minimax/minimax-m3:free"
    - "nvidia/nemotron-3.5-lightning:free"
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "cohere/north-mini-code:free"
    - "cloudflare/llama-3.3-70b"
  planner:
    - "openai/gpt-5.6-luna"
    - "minimax/minimax-m3:free"
    - "nvidia/nemotron-3.5-lightning:free"
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
    - "cloudflare/llama-3.3-70b"
  architect:
    - "openai/gpt-5.6-luna"
    - "minimax/minimax-m3:free"
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
    - "nvidia/nemotron-3.5-lightning:free"
    - "cloudflare/qwen-2.5-coder-32b"
  tester:
    - "openai/gpt-5.6-luna"
    - "minimax/minimax-m3:free"
    - "nvidia/nemotron-3.5-lightning:free"
    - "thinkingmachines/inkling:free"
    - "cloudflare/llama-3.3-70b"
  qa:
    - "openai/gpt-5.6-luna"
    - "google/gemini-3.5-flash"
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
    - "minimax/minimax-m3:free"
    - "nvidia/nemotron-3.5-lightning:free"
    - "cloudflare/qwen-2.5-coder-32b"
  setup:
    - "openai/gpt-5.6-luna"
    - "minimax/minimax-m3:free"
    - "deepseek/deepseek-v4-flash"
    - "nvidia/nemotron-3.5-lightning:free"
    - "cloudflare/llama-3.3-70b"

# OpenRouter free-model ranking boosts (substring match on model id)
freeModelScoreBoost:
  - pattern: "minimax-m3"
    boost: 10.0
  - pattern: "nemotron-3.5-lightning"
    boost: 9.0
  - pattern: "nemotron-3-ultra"
    boost: 8.5
  - pattern: "gemini-3.5-flash"
    boost: 8.0
  - pattern: "nemotron-3-super"
    boost: 7.0
  - pattern: "north-mini-code"
    boost: 6.0
  - pattern: "inkling"
    boost: 5.0
  - pattern: "minimax-m2.7"
    boost: 4.5
  - pattern: "gemini-2.5-flash-lite"
    boost: 4.0

# Model-name classification heuristics (previously hardcoded in Go). All entries
# are substrings matched against lowercase model ids; markers may be joined with
# "+" to require ALL substrings (e.g. "llama-3.2+70b"). Empty lists match nothing.
modelClassification:
  # Vendor namespaces hosted on NVIDIA NIM that are treated as chat-capable.
  nvidiaChatPrefixes:
    - "nvidia/"
    - "meta/"
    - "google/"
    - "mistralai/"
    - "microsoft/"
    - "deepseek/"
  # Substrings that exclude an NVIDIA model from chat use (embeddings, safety, etc).
  nvidiaChatExcluded:
    - "embed"
    - "safety"
    - "guard"
    - "clip"
    - "vila"
    - "riva"
    - "calibration"
    - "pixel"
    - "neva"
  # Substrings that qualify an NVIDIA model as chat/instruct capable.
  nvidiaChatMarkers:
    - "instruct"
    - "nemotron"
    - "chat"
    - "coder"
  # Substrings marking models that support tool/function calling.
  toolSupportMarkers:
    - "nemotron"
    - "llama-3.3"
    - "llama-3.2+70b"
    - "deepseek"
    - "qwen2.5"
    - "qwen3"
  # Model substrings that classify a request as COMPLEX (unless model has :free).
  complexModelHints:
    - "sonnet"
    - "gpt-4o"
    - "opus"
    - "o1-"
  # OpenRouter models to always skip (non-chat/audio/reasoning edge cases).
  openRouterExcluded:
    - "lyria"
    - "liquid"
  # Cerebras model-name markers treated as budget (tried even for simple requests).
  cerebrasBudgetMarkers:
    - "8b"
    - "preview"
    - "oss"
    - "qwen-3"
  # Substrings marking a model as small/weak (kept out of complex originalModel routes).
  weakModelMarkers:
    - "-1b-"
    - "-3b-"
    - "-7b-"
    - "-8b-"
    - "-11b-"
    - "-12b-"
    - "nano"
    - "mini"

trustedScoringNames:
  - google
  - meta
  - nvidia
  - mistral
  - anthropic
  - openai
  - microsoft
  - qwen
  - deepseek

# Shown on /v1/models for clients that probe before chat
compatModels:
  - id: claude-3-5-sonnet-20241022
    displayName: Claude 3.5 Sonnet
    ownedBy: anthropic
  - id: claude-3-5-sonnet
    displayName: Claude 3.5 Sonnet (Legacy)
    ownedBy: anthropic
  - id: gpt-4o
    displayName: GPT-4o
    ownedBy: openai
  - id: gpt-4
    displayName: GPT-4
    ownedBy: openai

defaultResponseModel: "gpt-4o"
anthropicResponseModel: "claude-3-5-sonnet-20241022"

# Priority 0.15: Google Gemini API free tier (requires GEMINI_API_KEY in .env)
# Routes to generativelanguage.googleapis.com OpenAI-compatible endpoint — not OpenRouter.
geminiModels:
  - id: "google/gemini-3.5-flash"
    model: "gemini-3.5-flash"
  - id: "google/gemini-2.5-flash-lite"
    model: "gemini-2.5-flash-lite"

# Cerebras: Freeride tries massive budget/performance Cerebras before NVIDIA/meta when size allows.
# Small entries (8b) are blocked for polecat when local GPU is on (blockSmallCloudWhenLocalGPU).
# Priority 0.1: Free/Ultra-cheap Cerebras (High speed, zero/low cost)
cerebrasBudget:
  # All Cerebras models failing (0% success) — removed

# Priority 0.5: Paid Cerebras Performance (Used for COMPLEX only)
cerebrasPerformance:

# Priority 0.6: Groq (Used for fast inference when Cerebras fails or is missing)
groqBudget:
  - "groq/qwen/qwen3.8-27b"                  # 27B dense, 262K context, $0.60/$3.60 per 1M — replaces qwen3.6-27b

groqPerformance:

# Priority 1: Verified working free/paid models (OpenRouter)
reliableFree:
  - "minimax/minimax-m3:free"
  - "nvidia/nemotron-3.5-lightning:free"
  - "nvidia/nemotron-3-ultra-550b-a55b:free"
  - "nvidia/nemotron-3-super-120b-a12b:free"
  - "cohere/north-mini-code:free"
  - "thinkingmachines/inkling:free"
  - "minimax/minimax-m2.7:free"
  - "dots-studio/dots-3-note-preview:free"

# Priority 2: Reliable NVIDIA NIM models (verified chat/completions 2026-05-17)
# 70b/nemotron-super for agents; 11b for lighter tasks.
nvidiaReliable:
  - "nvidia/nemotron-3-super-120b-a12b"
  - "meta/llama-3.2-11b-vision-instruct"

# Priority 2.5: Complex-task NVIDIA models (always tried first for complex requests)
# These are only used when isComplex() detects tools, long context, or agent workflows.
nvidiaComplex:
  - "nvidia/nemotron-3-super-120b-a12b"

# Cloudflare Workers AI models — free inference via Workers AI
# Requires CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN env vars set
# Model format: id: "cloudflare/@cf/model-name", model: "@cf/org/model-name"
cloudflareModels:
  - id: "cloudflare/llama-3.3-70b"
    model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
  - id: "cloudflare/qwen-2.5-coder-32b"
    model: "@cf/qwen/qwen2.5-coder-32b-instruct"

# Models that should be tried even if they are paid (if --allow-paid is set)
curatedPaid:
  - "deepseek/deepseek-v4-flash"             # $0.09 (In) / $0.18 (Out) per 1M — 284B MoE, 1M context
  - "openai/gpt-5.6-luna"                    # $0.10 (In) / $0.60 (Out) per 1M — fast, 1M context, 128K output
  - "openai/gpt-4o-mini"                     # $0.15 (In) / $0.60 (Out) per 1M

